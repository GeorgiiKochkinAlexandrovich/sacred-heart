<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sacred Heart — прозрачная помощь на Solana</title>
<meta name="description" content="Sacred Heart — прозрачная благотворительная платформа на Solana. 85% каждого пожертвования автоматически уходит на помощь: лечение зависимостей и психическое здоровье, восстановление документов за границей, помощь украинцам, операции.">
<meta property="og:title" content="Sacred Heart — каждое сердце заслуживает второй шанс">
<meta property="og:description" content="85% каждого пожертвования — на помощь. Каждый перевод можно проверить в блокчейне.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%2313213A'/%3E%3Cpath d='M50 76 C32 63 23 52 23 41 C23 33 29 27 37 27 C43 27 47 31 50 36 C53 31 57 27 63 27 C71 27 77 33 77 41 C77 52 68 63 50 76 Z' fill='none' stroke='%23D46A77' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M50 44 C54 49 55 52 54 55 C53 57 47 57 46 55 C45 52 46 49 50 44 Z' fill='%23C9A45C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#13213A; --navy-2:#1A2B47; --navy-3:#22355A; --line:#2B3A52;
    --ivory:#F4F2EE; --paper:#FBFAF7; --ink:#13213A; --ink-2:#4A5568;
    --muted:#A9B4C6; --gold:#C9A45C; --gold-2:#DDBD7A; --rose:#D46A77; --rose-deep:#B23A48;
    --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
    --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --r:18px; --wrap:1160px;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; font-family:var(--sans); color:var(--ink); background:var(--paper); line-height:1.6; -webkit-font-smoothing:antialiased; }
  img { max-width:100%; display:block; }
  a { color:inherit; }
  .wrap { max-width:var(--wrap); margin:0 auto; padding:0 24px; }
  .serif { font-family:var(--serif); }
  .eyebrow { font-size:13px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:#8A6A2B; }
  .hero .eyebrow, .transp .eyebrow { color:var(--gold); }
  h1,h2,h3 { font-family:var(--serif); font-weight:600; line-height:1.15; margin:0; letter-spacing:-.01em; }
  h2 { font-size:clamp(30px,4vw,44px); }
  p { margin:0; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 22px; border-radius:999px; font:600 15px var(--sans); border:0; cursor:pointer; text-decoration:none; transition:transform .15s ease, background .15s ease, box-shadow .15s ease; }
  .btn:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline:3px solid var(--gold-2); outline-offset:3px; }
  .btn-gold { background:var(--gold); color:var(--navy); }
  .btn-gold:hover { background:var(--gold-2); transform:translateY(-1px); }
  .btn-ghost { background:transparent; color:var(--ivory); box-shadow:inset 0 0 0 1px rgba(244,242,238,.35); }
  .btn-ghost:hover { box-shadow:inset 0 0 0 1px var(--ivory); }
  .btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }

  /* test banner */
  .testnet { background:var(--gold); color:var(--navy); font-size:14px; font-weight:500; text-align:center; padding:8px 16px; }

  /* nav */
  header.nav { position:sticky; top:0; z-index:20; background:rgba(19,33,58,.92); backdrop-filter:saturate(140%) blur(10px); border-bottom:1px solid rgba(255,255,255,.06); }
  .nav-in { display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:72px; }
  .logo { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ivory); }
  .logo span { font-family:var(--serif); font-weight:600; font-size:22px; }
  .nav-links { display:flex; gap:28px; }
  .nav-links a { color:var(--muted); text-decoration:none; font-size:15px; }
  .nav-links a:hover { color:var(--ivory); }
  @media (max-width:900px){ .nav-links { display:none; } }

  /* hero */
  .hero { background:var(--navy); color:var(--ivory); position:relative; overflow:hidden; }
  .hero::before { content:""; position:absolute; right:-200px; top:-160px; width:720px; height:720px; border-radius:50%; background:radial-gradient(closest-side, rgba(201,164,92,.16), transparent); pointer-events:none; }
  .hero-in { display:grid; grid-template-columns:1.15fr .85fr; gap:48px; align-items:center; padding:96px 0 88px; position:relative; }
  .hero h1 { font-size:clamp(40px,6vw,68px); }
  .hero h1 em { font-style:italic; color:var(--gold-2); font-weight:500; }
  .hero .lead { font-size:19px; color:#C9D2E0; max-width:560px; margin-top:22px; }
  .hero .cta { display:flex; gap:14px; flex-wrap:wrap; margin-top:34px; }
  .hero-mark { justify-self:center; width:min(380px,80vw); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 50% 45%, rgba(212,106,119,.12), rgba(19,33,58,0) 65%); box-shadow:inset 0 0 0 1px rgba(201,164,92,.25); }
  .hero-mark svg { width:62%; height:auto; }
  .flame { transform-origin:50px 56px; animation:flicker 3.2s ease-in-out infinite; }
  @keyframes flicker { 0%,100%{ transform:scale(1); opacity:1 } 50%{ transform:scale(1.08) translateY(-1px); opacity:.9 } }
  @media (prefers-reduced-motion:reduce){ .flame{ animation:none } html{ scroll-behavior:auto } }
  .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--line); position:relative; }
  .stat { padding:28px 0; }
  .stat + .stat { padding-left:28px; border-left:1px solid var(--line); }
  .stat b { display:block; font-family:var(--serif); font-size:34px; font-weight:600; color:var(--ivory); }
  .stat span { font-size:14px; color:var(--muted); }
  @media (max-width:860px){ .hero-in { grid-template-columns:1fr; padding:64px 0 48px; } .hero-mark { width:220px; order:-1; justify-self:start; } }
  @media (max-width:560px){ .stats { grid-template-columns:1fr; } .stat + .stat { padding-left:0; border-left:0; border-top:1px solid var(--line); } }

  section { padding:104px 0; }
  .sec-head { max-width:720px; margin-bottom:52px; }
  .sec-head p:not(.eyebrow) { color:var(--ink-2); font-size:18px; margin-top:16px; }

  /* causes */
  .causes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
  @media (max-width:860px){ .causes { grid-template-columns:1fr; } }
  .cause { background:#fff; border:1px solid #E7E3DB; border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column; transition:box-shadow .2s ease, transform .2s ease; }
  .cause:hover { box-shadow:0 18px 40px -24px rgba(19,33,58,.35); transform:translateY(-2px); }
  .cause .art { background:var(--navy); aspect-ratio:16/7; display:grid; place-items:center; }
  .cause .art svg { width:100%; height:100%; }
  .cause .body { padding:28px; display:flex; flex-direction:column; gap:14px; flex:1; }
  .cause h3 { font-size:26px; }
  .cause .desc { color:var(--ink-2); }
  .cause .meta { display:flex; flex-wrap:wrap; gap:8px 20px; font-size:14px; color:var(--ink-2); padding-top:14px; border-top:1px solid #EFEBE4; margin-top:auto; }
  .cause .meta b { color:var(--ink); }
  .cause .meta a { color:var(--rose-deep); }
  .give { display:flex; gap:10px; flex-wrap:wrap; }
  .give .amounts { display:flex; gap:8px; }
  .chip { min-height:44px; padding:0 14px; border-radius:999px; border:1px solid #DCD6CB; background:#fff; font:500 14px var(--sans); cursor:pointer; color:var(--ink); }
  .chip:hover, .chip[aria-pressed="true"] { border-color:var(--navy); background:var(--navy); color:var(--ivory); }
  .give label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .give input { flex:1; min-width:120px; min-height:44px; border-radius:999px; border:1px solid #DCD6CB; padding:0 16px; font:500 15px var(--sans); color:var(--ink); background:#fff; }
  .give .btn-gold { background:var(--navy); color:var(--ivory); }
  .give .btn-gold:hover { background:var(--navy-3); }
  .cause.closed { opacity:.6; }
  .skeleton { min-height:420px; background:linear-gradient(90deg,#f0ede7,#f7f5f1,#f0ede7); background-size:200% 100%; animation:sh 1.4s linear infinite; border-radius:var(--r); }
  @keyframes sh { to { background-position:-200% 0 } }

  /* how */
  .how { background:var(--ivory); }
  .steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; }
  @media (max-width:860px){ .steps { grid-template-columns:1fr; } }
  .step { background:#fff; border-radius:var(--r); padding:30px; border:1px solid #E7E3DB; }
  .step .n { font-family:var(--serif); font-size:44px; color:#9A7A38; line-height:1; }
  .step h3 { font-size:22px; margin:14px 0 10px; }
  .step p { color:var(--ink-2); }
  .split { display:grid; grid-template-columns:85fr minmax(160px,15fr); height:56px; border-radius:14px; overflow:hidden; margin-top:40px; font-weight:600; font-size:15px; }
  .split div { display:flex; align-items:center; justify-content:center; padding:0 12px; text-align:center; }
  .split .b { background:var(--navy); color:var(--ivory); } .split .c { background:var(--gold); color:var(--navy); }
  .split-note { color:var(--ink-2); font-size:15px; margin-top:14px; }

  /* transparency */
  .transp { background:var(--navy); color:var(--ivory); }
  .transp .sec-head p:not(.eyebrow) { color:#C9D2E0; }
  .tgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
  @media (max-width:860px){ .tgrid { grid-template-columns:1fr; } }
  .tcard { border:1px solid var(--line); border-radius:var(--r); padding:26px; background:var(--navy-2); }
  .tcard h3 { font-size:20px; margin-bottom:8px; }
  .tcard p { color:#C9D2E0; font-size:15px; }
  .addr { display:flex; align-items:center; gap:10px; margin-top:14px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; background:rgba(0,0,0,.2); border-radius:10px; padding:10px 12px; word-break:break-all; }
  .addr a { color:var(--gold-2); }

  /* founder */
  .founder-in { display:grid; grid-template-columns:.8fr 1.2fr; gap:64px; align-items:center; }
  @media (max-width:860px){ .founder-in { grid-template-columns:1fr; gap:36px; } }
  .photo { position:relative; }
  .photo img { border-radius:var(--r); width:100%; aspect-ratio:4/5; object-fit:cover; filter:saturate(.92); }
  .photo::after { content:""; position:absolute; inset:16px -16px -16px 16px; border:1px solid var(--gold); border-radius:var(--r); z-index:-1; }
  .founder blockquote { margin:0; font-family:var(--serif); font-size:clamp(24px,3vw,32px); line-height:1.3; font-weight:500; font-style:italic; }
  .founder .story { color:var(--ink-2); font-size:17px; margin-top:24px; display:grid; gap:14px; }
  .founder .sign { margin-top:26px; font-weight:600; }
  .founder .sign span { display:block; font-weight:400; color:var(--ink-2); font-size:14px; }
  .fill { background:#FFF4DA; border-radius:4px; padding:0 4px; }

  /* get help */
  .help { background:var(--ivory); }
  .help-in { display:grid; grid-template-columns:1fr 1fr; gap:48px; }
  @media (max-width:860px){ .help-in { grid-template-columns:1fr; } }
  .list { display:grid; gap:14px; margin-top:24px; padding:0; list-style:none; }
  .list li { display:flex; gap:12px; color:var(--ink-2); }
  .list svg { flex:none; margin-top:4px; }
  .apply { background:#fff; border:1px solid #E7E3DB; border-radius:var(--r); padding:32px; display:flex; flex-direction:column; gap:14px; }
  .apply h3 { font-size:24px; }
  .apply p { color:var(--ink-2); }

  /* faq */
